<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <b>
        This is bold text
    </b>
    <strong>
        This is strong text
    </strong>
    <i>
        This is italic text
    </i>
    <em>
        This is emphasized text
    </em>
    <small>
        This is small text
    </small>
    <mark>
        This is marked text
    </mark>
    <p>
        My favorite color is<del> red </del>Blue.
    </p>
    <p>
        My favorite color is<ins>
            red
        </ins>
        Blue.
    </p>
    <p>
        This is<sub>
            subscript
        </sub>
        text.
    </p>
</body>
</html>
